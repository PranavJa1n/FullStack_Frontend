<!DOCTYPE html>
<html>
    <head>
        <title>Navbar</title>
        <style>
            body{
                margin: 0px;
                padding: 0px;
            }
            .navbar{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                border: 1px solid black;
                background-color: antiquewhite;
                flex-wrap: wrap;
            }
            .navbar__logo{
                flex: 4 1 1;
                display: flex;
                align-items: center;
                margin: 0% 1% 0% 1%;
            }
            .navbar__unorderedlist{
                list-style-type: none;
                display: flex;
                column-gap: 10%;
                flex: 1;
            }
            .navbar__button__submit{
                margin: 10px;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <div class="navbar__logo">
                LOGO
            </div>
            <ul class="navbar__unorderedlist">
                <li>Nav1</li>
                <li>Nav2</li>
                <li>Nav3</li>
                <li>Nav4</li>
            </ul>
            <button class="navbar__button__submit" type="submit">Login</button>
        </div>
    </body>
</html>
