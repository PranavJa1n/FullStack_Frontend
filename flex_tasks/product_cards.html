<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            padding: 0px;
            margin: 0px;
        }
        .container{
            display: flex;
            flex-wrap: wrap;
            height: 100vh;
            align-items: center;
            justify-content: space-around;
        }
        #d1, #d2, #d3, #d4, #d5, #d6, #d7, #d8{
            background-color: black;
            color: white;
            width: 300px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="d1">1</div>
        <div id="d2">2</div>
        <div id="d3">3</div>
        <div id="d4">4</div>
        <div id="d5">5</div>
        <div id="d6">6</div>
        <div id="d7">7</div>
        <div id="d8">8</div>
    </div>
</body>
</html>
