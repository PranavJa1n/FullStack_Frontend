<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
            flex-direction: row-reverse;
        }
        #one{
            flex: 3;
            background-color: red;
            height: 100px;
            width: 100px;
            min-width: 500px;
        }
        #two{
            flex: 1;
            background-color: green;
            height: 100px;
            width: 100px;
        }
        #tree{
            flex: 1;
            background-color: blue;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="one">1</div>
        <div id="two">2</div>
        <div id="tree">3</div>
    </div>
</body>
</html>
