<!DOCTYPE html>
<html>
    <head>
        <title>LoginFlex</title>
        <style>
            .display{
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 98vw;
                height: 97vh;
            }
            .login{
                display: flex;
                flex-direction: column;
                border: 1px solid black;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <div class="display">
            <div class="login">
                <h2>Login Page</h2>
                <label for="Username">Username</label>
                <input id="Username">
                <label for="Password">Password</label>
                <input id="Password" type="password">
            </div>
        </div>
    </body>
</html>
