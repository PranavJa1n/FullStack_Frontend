<!DOCTYPE html>
<html>
    <head>
        <title>LoginFlex</title>
        <style>
            .login{
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <div class="login">
            <h2>Login Page</h2>
            <label for="Username">Username</label>
            <input id="Username">
            <label for="Password">Password</label>
            <input id="Password" type="password">
        </div>
    </body>
</html>
