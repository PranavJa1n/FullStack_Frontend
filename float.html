<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box1, #box3, #box5{
            background-color: yellowgreen ;
            float: left;
            width: 16%;
        }
        #box2, #box4, #box6{
            width: 16%;
            float: left;
        }
        #box1{
            outline: 5px solid red; /* same as border but the different is that it will not move other elements aside like borader it will go behind them*/
        }
        #box5{
            clear: both; /* will remove its property of float */
        }
    </style>
</head>
<body>
    <div id="box1">box1</div>
    <div id="box2">box2</div>
    <div id="box3">box3</div>
    <div id="box4">box4</div>
    <div id="box5">box5</div>
    <div id="box6">box6</div>
</body>
</html>
