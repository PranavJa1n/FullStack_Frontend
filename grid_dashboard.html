<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid Dashboard</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap:3%;
            grid-template-areas: 
            "box1 box1 box1"
            "box2 box3 box3"
            "box2 box4 box5"
            "box6 box6 box6";
        }
        .box{
            background-color: blue;
            min-height: 150px;
            border: 2px solid black;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: box1;"></div>
        <div class="box" style="grid-area: box2;"></div>
        <div class="box" style="grid-area: box3;"></div>
        <div class="box" style="grid-area: box4;"></div>
        <div class="box" style="grid-area: box5;"></div>
        <div class="box" style="grid-area: box6;"></div>
    </div>
</body>
</html>
