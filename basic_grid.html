<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap:3%;
            grid-template-areas: 
            "box1 box1 box2"
            "box1 box1 box3"
            "box4 box4 box5"
            "box6 box6 box7"
            "box8 box9 box7";
        }
        .box{
            background-color: blue;
            /* height: 100px;     This will force the height to be exactly 100px while will not allow box to grow vertically*/ 
            min-height: 100px;
        }

        @media (max-width:500px) {      /*To make the grid responsive*/
            .container{
                grid-template-areas: 
                    "box1 box2 box3"
                    "box4 box5 box6"
                    "box7 box8 box9";
                }
            }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: box1;"></div>
        <div class="box" style="grid-area: box2;"></div>
        <div class="box" style="grid-area: box3;"></div>
        <div class="box" style="grid-area: box4;"></div>
        <div class="box" style="grid-area: box5;"></div>
        <div class="box" style="grid-area: box6;"></div>
        <div class="box" style="grid-area: box7;"></div>
        <div class="box" style="grid-area: box8;"></div>
        <div class="box" style="grid-area: box9;"></div>
    </div>
</body>
</html>
