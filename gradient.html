<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container1{
            width: 200px;
            height: 200px;
            background-image: linear-gradient(148deg, lightblue, black);
        }
        .container2{
            width: 200px;
            height: 200px;
            background: conic-gradient(red 0deg, green 90deg, blue 180deg, yellow 360deg);
        }
        .loading-parent{
            width: 98vw;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .outer-loading{
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 212px;
            height: 212px;
            background-color: coral;
        }
        .loading{
            width: 200px;
            height: 200px;
            background: conic-gradient(lightblue 50deg, cyan 90deg, blue 180deg, black 270deg);
            border-radius: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .circle{
            width: 150px;
            align-items: center;
            height: 150px;
            border-radius: 200px;
            background-color: #001111;
        }
        .border-box{
            border-radius: 5%;
            width: 200px;
            height: 200px;
            background: conic-gradient(red,blue,yellow, blue);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .inner-border-box{
            background-color: black;
            border-radius: 5%;
            width: 185px;
            height: 185px;
        }
        .box{
            width: 200px;
            height: 200px;
        }
        p{
            font-size: 50px;
            text-align: center;
            justify-content: center;
            background: linear-gradient(#c2185b, white);
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container1"></div>
    <div class="container2"></div>
    <div class="loading-parent">
        <div class="outer-loading">
            <div class="loading">
                <div class="circle"></div>
            </div>
        </div>
    </div>
    <div class="border-box">
        <div class="inner-border-box">
            <p>BOX</p>
        </div>
    </div>
</body>
</html>
