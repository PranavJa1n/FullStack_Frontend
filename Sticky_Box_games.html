    <title>Document</title>
    <style>
        body{

        }
        h1{
            color: white;

        }
        .container{
            height: 100vh;
            width: 98vw;

            align-items: center;
        }
        .box{

            width: 44vw;
            position: sticky;
            top:10px;
            border-radius: 10px;
        }
