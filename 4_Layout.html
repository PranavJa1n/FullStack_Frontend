<!DOCTYPE html>
<html lang="en">
<head>
    <title>Layout</title>
    <style>        
        .layout{
            display: flex;
        }
        .navbar{
                width: 25%;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                border: 1px solid black;
                border-radius: 5px;
                background-color: antiquewhite;
                height: 100vh;
            }
        #logo{
            flex: 1;
            display: flex;
            margin-top: 20%;
            margin-left: 40%;
        }
        .nav-ul{
            display: flex;
            flex-direction: column;
            align-items: center;
            list-style-type: none;
            row-gap: 10px;
            flex: 1;
            padding: 0%;
            margin: 0%;
        }
        .right{
            flex: 1;
            padding: 24px;
            flex-direction: column;
        }
        .container{
            display: flex;
            flex-wrap: wrap;
            column-gap: 2%;
        }
        .card{
            padding: 3%;
            flex: 1;
            min-height: 200px;
            max-height: 200px;
            min-width: 150px;
            max-width: 150px;
            margin-top: 2%;
            border: 1px solid black;
            border-radius: 3px;
            background-color: darkgray;
        }
        .table{
            flex: 1;
            width: 100px;
            
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="navbar">
            <div id="logo">LOGO</div>
            <ul class="nav-ul">
                <li>Nav1</li>
                <li>Nav2</li>
                <li>Nav3</li>
                <li>Nav4</li>
            </ul>
        </div>
        <div class="right">
            <div class="container">
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
            <div class="table">
                <table>
                    <th>
                        <tr>Hello</tr>
                    </th>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
