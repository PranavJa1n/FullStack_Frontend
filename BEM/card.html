<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{          /* BEM is a methodology of naming element */
            width: 200px;
            padding: 3%;
            box-shadow: 3px 3px 5px grey;
            margin: auto;
        }
        .card__text{
            font-family: Arial;
            font-weight: 900;
        }
        .card__button__submit{
            background-color: black;
            color: white;
            box-shadow: 3px 3px 5px grey;
            width: 100px;
            height: 40px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="card__img" src="https://picsum.photos/id/870/200/300">
        <p class="card__text">qwertyuio</p>
        <button class="card__button__submit" type="submit">submit</button>
    </div>
</body>
</html>
