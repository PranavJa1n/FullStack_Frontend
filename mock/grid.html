<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
        }
        .container{
            width: 99vw;
            height: 1000vh;
            background-color: whitesmoke;
            display: grid;
        }
        .nav{
            background-color: white;
            width: 99vw;
            height: 50px;
            position: sticky;
            top: 0px;
            display: flex;
        }
        .navT{
            display: flex;
            height: 100%;
            width: 20%;
            justify-content: center;
            align-items: center;
        }
        .navT>h2{
            color: red;
            margin: 0;
        }
        .navS{
            height: 100%;
            width: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .search{
            width: 90%;
            height: 70%;
            display: flex;
            align-items: center;
            border: 1px solid grey;
            background-color: whitesmoke;
            border-radius: 100px;
            padding: 0 0 0 10px;
        }
        .container{
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            grid-auto-rows: 10px;
            column-gap: 10px;
            row-gap: 50px;
        }
        .item{
            border: 2px solid black;
            border-radius: 20px;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .p{
            background-color: white;
            color: black;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0 0 20px 20px
        }
    </style>
</head>
<body>
    <div class="nav">
            <div class="navT"><h2>TitlePress</h2></div>
            <div class="navS"><div class="search">Search for ideas</div></div>
        </div>
    <div class="container">
        <div class="item" style="grid-row: span 10; background-color: red;"><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 4; background-color: maroon;"><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 6; background-color: pink;"><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 8; background-color: aqua;"><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 15; "><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 6;"><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 7;"><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 9;"><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 2;"><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 7;"><div class="p">Hellp</div></div>
        <div class="item" style="grid-row: span 15;"><div class="p">Hellp</div></div>
    </div>
</body>
</html>
