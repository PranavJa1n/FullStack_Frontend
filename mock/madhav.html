<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            display:grid;
            grid-template-columns: repeat(5,1fr);
            grid-auto-rows:10px; 
            row-gap:15px;
        }
        .a{
            /* height:200px; */
            border:3px solid black;
            margin:10px;

        }
    </style>
</head>
<body>
    <div class="con">
        <div class="a" style="grid-row:span 10">one</div>
        <div class="a" style="grid-row:span 5">two</div>
        <div class="a" style="grid-row:span 10">three</div>
        <div class="a" style="grid-row:span 5">four</div>
        <div class="a" style="grid-row:span 10">five</div>
        <div class="a" style="grid-row:span 5">six</div>
        <div class="a" style="grid-row:span 10">seven</div>
        <div class="a" style="grid-row:span 5">eight</div>
        <div class="a" style="grid-row:span 10">nine</div>
        <div class="a" style="grid-row:span 5">ten</div>
        <div class="a" style="grid-row:span 10">eleven</div>
        <div class="a" style="grid-row:span 15">eleven</div>
        <div class="a" style="grid-row:span 1">eleven</div>
        <div class="a" style="grid-row:span 10">eleven</div>
        <div class="a" style="grid-row:span 40">eleven</div>
        <div class="a" style="grid-row:span 20">eleven</div>
        <div class="a" style="grid-row:span 10">eleven</div>
        <div class="a" style="grid-row:span 5">eleven</div>
    </div>
</body>
</html>
