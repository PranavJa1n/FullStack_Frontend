<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{              /* Global scope */
            --primary-color: aqua;              /* These are variables and are created using -- aything after it is a variable*/
            --secondary-color: black;
            --font-size: 10px;
            --two: 2;
        }
        .container{
            height: 500px;
            width: 500px;
            outline: 1px solid black;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }
        .parent{
            font-size: calc(var(--font-size) * var(--two));
            grid-column: 1/3;
            grid-row: 1/3;
            background-color: var(--primary-color);
            display: grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
        }
        .child{
            background-color: var(--secondary-color);
            grid-column: 2;
            grid-row: 1;
        }
        #para{
            --primary-color: cadetblue;         /* Will override the original variable from root */
            background-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            <p>Helloooooo!!!!!!!</p>
            <div class="child">1</div>
        </div>
    </div>
    <div id="para">
        <p >Helloo from outside div</p>
    </div>
</body>
</html>
